 const card=(kind,title,stock,why,score)=>stock?`<div class="dec-card ${kind}" onclick="selectStock('${stock.symbol}')" style="cursor:pointer"><h3>${title} <span class="scorebig">${Math.round(score ?? stock.opportunity ?? 0)}/100</span></h3><div class="dec-symbol">${stock.symbol}</div><div>${stock.company}</div><p>${why}</p><b style="color:#58b5ff">View ${stock.has_active_position?'Sell':'Buy'} Ladder →</b></div>`:'';

function ladderRows(levels,type,hasPosition=true){if(!levels.length){const msg=(type==='sell'&&!hasPosition)?'<b>Position Closed</b><br><span style="color:var(--muted)">No shares are currently owned. No sell ladder is required.</span>':'No ladder for this side.';return `<tr><td colspan="6">${msg}</td></tr>`;}return levels.map(x=>`<tr><td><span class="levelbox">${x.level}</span></td><td><div class="price">${fmtMoney(x.price)}</div><div class="limit">Limit ${type==='buy'?'Buy':'Sell'}</div></td><td>${type==='buy'?fmtMoney(x.allocation):fmtPct(x.trim_pct||0)}</td><td>${fmtSh(x.shares)}</td><td>${type==='buy'?(x.status||'Waiting'):fmtMoney(x.proceeds)}</td><td>${x.note||''}</td></tr>`).join('')}
function positionCandidateTooltip(event,row){const tip=row.querySelector('.candidate-tooltip');if(!tip)return;const pad=14,width=300,height=tip.offsetHeight||190;let left=event.clientX+16,top=event.clientY+12;if(left+width+pad>window.innerWidth)left=event.clientX-width-16;if(top+height+pad>window.innerHeight)top=window.innerHeight-height-pad;tip.style.left=Math.max(pad,left)+'px';tip.style.top=Math.max(pad,top)+'px';}
function selectStock(sym){const s=DATA.stocks.find(x=>x.symbol===sym)||DATA.stocks[0]; document.querySelectorAll('.stock-nav').forEach(el=>el.classList.toggle('active',el.dataset.symbol===sym)); const pl=s.total_pl||0; document.getElementById('detail').innerHTML=`

 <div class="content"><div class="ladder-stack">${s.buy?.length?`<div class="ladder buy"><h3>Buy Ladder · ${s.has_active_position?'Accumulate on Weakness':(s.qualified_candidate?'Confirmed':'Pending '+(s.confirmation_days||0)+'/2 Days')} <span style="float:right;color:var(--muted);font-size:13px">Budget: ${fmtMoney(s.buy.reduce((a,b)=>a+b.allocation,0))}</span></h3><table><thead><tr><th>Level</th><th>Price</th><th>Allocation</th><th>Shares</th><th>Status</th><th>Notes</th></tr></thead><tbody>${ladderRows(s.buy,'buy',false)}</tbody></table></div>`:''}${s.sell?.length?`<div class="ladder sell"><h3>Sell Ladder · ${s.position_state?.name||'Manage'} <span style="float:right;color:var(--muted);font-size:13px">Target: ${fmtMoney(s.sell.reduce((a,b)=>a+b.proceeds,0))}</span></h3><table><thead><tr><th>Level</th><th>Price</th><th>Trim</th><th>Shares</th><th>Proceeds</th><th>Notes</th></tr></thead><tbody>${ladderRows(s.sell,'sell',true)}</tbody></table></div>`:''}${(!s.buy?.length&&!s.sell?.length)?`<div class="box"><h3>No Active Ladder</h3><p>Current signal does not authorize a buy or sell ladder.</p></div>`:''}</div><div class="box"><h3>Recommendation State</h3><div style="font-size:24px;font-weight:900">${s.position_state?.name||'New Opportunity'}</div><p>${s.position_state?.action||''}</p><div>Base OPS <b style="float:right">${fmtOps(s.base_ops??s.raw_opportunity??s.opportunity)}</b></div><div>Confirmed OPS <b style="float:right">${fmtOps(s.confirmed_ops??s.opportunity)}</b></div><div>News Impact <b class="${Number(s.news_adjustment||0)>=0?'positive':'negative'}" style="float:right">${Number(s.news_adjustment||0)>0?'+':''}${Number(s.news_adjustment||0).toFixed(1)}</b></div><div>News-Refined OPS <b style="float:right">${fmtOps(s.final_ops??s.opportunity)}</b></div><div>Confirmation <b style="float:right">${s.confirmation_days||0}/2 days</b></div><div class="callout"><b>News Refinement</b><span>${s.news_reason || 'No material recent company-news event detected.'}</span></div></div><div class="side-panel"><div class="box"><h3>Score Breakdown</h3><div style="color:var(--muted);font-size:12px;margin-bottom:10px">Opportunity score is tactical. Business quality is long-term.</div>${['Relative Strength','Momentum','Price Structure','Capital Priority','Opportunity Score'].map((n,i)=>`<div class="profile-row"><span>${n}</span><div class="meter"><span style="width:${Math.max(10,Math.min(100,s.leadership-(i*2)))}%"></span></div><b>${Math.max(0,Math.round(s.leadership-(i*2)))}</b></div>`).join('')}</div><div class="box"><h3>Key Levels</h3><div>Current: <b style="float:right">${fmtMoney(s.price)}</b></div><div>Avg Cost: <b style="float:right">${fmtMoney(s.avg_cost)}</b></div><div>Shares: <b style="float:right">${fmtSh(s.quantity)}</b></div><div>Weight: <b style="float:right">${fmtPct(s.weight)}</b></div><div>Reason Owned: <b style="float:right">${s.own_reason || 'LadderIQ Selected'}</b></div><div class="callout"><b>Score Interpretation</b><span>${s.score_reason || 'Opportunity score controls today’s capital allocation.'}</span></div></div></div></div>
 <div class="lower"><div class="box"><h3>Technical Snapshot</h3><div>Price (AH) <b style="float:right">${fmtMoney(s.price)}</b></div><div>Trend <b class="trend ${trendClass(s.trend)}" style="float:right">${s.trend}</b></div><div>Opportunity <b style="float:right">${fmtOps(s.final_ops ?? s.opportunity ?? s.leadership)}</b></div><div>Business Quality <b style="float:right">${Math.round(s.business_quality ?? s.leadership)}</b></div></div><div class="box"><h3>Portfolio Health</h3><div class="health-score positive">91<small>/100</small></div><div class="positive">Excellent</div><div class="health-bars"><div class="health-line"><span>Opportunity</span><div class="health-meter"><span style="width:95%"></span></div><b>95</b></div><div class="health-line"><span>Diversification</span><div class="health-meter"><span style="width:84%"></span></div><b>84</b></div><div class="health-line"><span>Risk Mgmt</span><div class="health-meter"><span style="width:92%"></span></div><b>92</b></div><div class="health-line"><span>Cash Efficiency</span><div class="health-meter"><span style="width:78%"></span></div><b>78</b></div><div class="health-line"><span>Momentum</span><div class="health-meter"><span style="width:97%"></span></div><b>97</b></div></div><div class="callout"><b>Biggest Weakness</b><span class="warning-text">NVDA concentration remains high; harvest plan stays active.</span></div></div><div class="box"><h3>Capital Allocation Engine</h3><div>Deployable cash: <b>${fmtMoney(DATA.metrics.deployable)}</b></div><div class="progress"><div class="bar" style="width:86%"></div></div><small>Cash efficiency: Good</small></div><div class="box"><h3>Allocation & Risk</h3><div style="font-size:34px;font-weight:900">${fmtPct(s.weight)}</div><div>Risk Status: <b class="positive">${s.weight>40?'Watch':'Good'}</b></div></div></div>`;}
function renderBenchmarkCard(){
 const b=DATA.benchmark || {};
 const series=(b.replay_series && b.replay_series.length)?b.replay_series:(b.series || []).map(x=>({date:x.date, qqq_price:x.price, qqq_roi:((Number(x.price)/Number(b.start_price))-1)*100, portfolio_roi:Number(DATA.metrics.roi||0)}));
 const maxIdx=Math.max(0,series.length-1);
 const defaultIdx=maxIdx;
 const end=series[defaultIdx] || {date:b.end_date, qqq_roi:b.return_pct, portfolio_roi:DATA.metrics.roi, alpha:b.alpha_pct};
 const port=Number(end.portfolio_roi ?? DATA.metrics.roi ?? 0);
 const qret=Number(end.qqq_roi ?? b.return_pct ?? 0);
 const bh=Number(end.buy_hold_roi ?? 0);
 const ladder=Number(end.ladder_alpha ?? (port-bh));
 const alpha=Number(end.alpha ?? (port-qret));
 const qqqValue=Number(end.qqq_value ?? (Number(DATA.metrics.baseline||0)*(1+qret/100)));
 const alphaDollars=Number(end.alpha_dollars ?? (Number(DATA.metrics.baseline||0)*(alpha/100)));
 const ladderValue=Number(end.ladder_value_added ?? 0);
 return `<div class="small-card"><h3>Benchmark vs QQQ</h3><div class="bench-alpha-label">Alpha vs QQQ</div><div id="benchAlpha" class="bench-big ${alpha>=0?'positive':'negative'}">${alpha>=0?'+':''}${fmtPct(alpha)}</div><div class="bench-line"><span>Portfolio TWR</span><b id="benchPortfolio">${port>=0?'+':''}${fmtPct(port)}</b></div><div class="bench-line"><span>QQQ ROI</span><b id="benchQQQ">${qret>=0?'+':''}${fmtPct(qret)}</b></div><div class="bench-microgrid"><div class="bench-micro">Buy & Hold<b id="benchBuyHold">${bh>=0?'+':''}${fmtPct(bh)}</b></div><div class="bench-micro">LadderIQ Value<b id="benchLadderValue" class="${ladderValue>=0?'positive':'negative'}">${ladderValue>=0?'+':''}${fmtMoney(ladderValue)}</b></div><div class="bench-micro">Ladder Alpha<b id="benchLadderAlpha" class="${ladder>=0?'positive':'negative'}">${ladder>=0?'+':''}${fmtPct(ladder)}</b></div><div class="bench-micro">Personal ROI<b id="benchPersonalROI">${Number(end.personal_roi ?? DATA.metrics.personal_roi ?? 0)>=0?'+':''}${fmtPct(Number(end.personal_roi ?? DATA.metrics.personal_roi ?? 0))}</b></div></div><div class="bench-period"><span>Period</span><b><span>${b.start_date||''}</span> → <span id="benchEndDate">${end.date||''}</span></b></div><input id="benchSlider" class="bench-range" type="range" min="0" max="${maxIdx}" value="${defaultIdx}" oninput="updateBenchmark(this.value)"><div class="bench-note">Start locked at 2026-04-07. Drag end date. Portfolio, QQQ, Buy & Hold, and LadderIQ Value update together.</div></div>`;
}
function updateBenchmark(idx){
 const b=DATA.benchmark || {}; const series=(b.replay_series && b.replay_series.length)?b.replay_series:(b.series || []);
 const item=series[Number(idx)] || series[series.length-1] || {};
 const port=Number(item.portfolio_roi ?? DATA.metrics.roi ?? 0);
 const qret=Number(item.qqq_roi ?? (((Number(item.price||item.qqq_price)/Number(b.start_price))-1)*100) ?? 0);
 const bh=Number(item.buy_hold_roi ?? 0);
 const ladder=Number(item.ladder_alpha ?? (port-bh));
 const alpha=Number(item.alpha ?? (port-qret));
 const ladderValue=Number(item.ladder_value_added ?? 0);
 const personal=Number(item.personal_roi ?? DATA.metrics.personal_roi ?? port);
 const alphaDollars=Number(item.alpha_dollars ?? (Number(DATA.metrics.baseline||0)*(alpha/100)));
 const qqqValue=Number(item.qqq_value ?? (Number(DATA.metrics.baseline||0)*(1+qret/100)));
 const setText=(id,txt)=>{const el=document.getElementById(id); if(el)el.textContent=txt;};
 const setClass=(id,base,val)=>{const el=document.getElementById(id); if(el)el.className=(base?base+' ':'')+(val>=0?'positive':'negative');};
 setText('benchAlpha',(alpha>=0?'+':'')+fmtPct(alpha)); setClass('benchAlpha','bench-big',alpha);
 setText('benchPortfolio',(port>=0?'+':'')+fmtPct(port));
 setText('benchQQQ',(qret>=0?'+':'')+fmtPct(qret));
 setText('benchBuyHold',(bh>=0?'+':'')+fmtPct(bh));
 setText('benchLadderAlpha',(ladder>=0?'+':'')+fmtPct(ladder)); setClass('benchLadderAlpha','',ladder);
 setText('benchLadderValue',(ladderValue>=0?'+':'')+fmtMoney(ladderValue)); setClass('benchLadderValue','',ladderValue);
 setText('benchPersonalROI',(personal>=0?'+':'')+fmtPct(personal));
 setText('benchEndDate',item.date || '');
 setText('benchAlphaDollars',(alphaDollars>=0?'+':'')+fmtMoney(alphaDollars)); setClass('benchAlphaDollars','',alpha);
 setText('benchQQQValue',fmtMoney(qqqValue));
 setText('benchStatus',alpha>=0?'Beating':'Lagging'); setClass('benchStatus','',alpha);
}
