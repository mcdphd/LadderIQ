const fmtMoney = v => '$' + Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = v => Number(v||0).toFixed(2)+'%';
const fmtSh = v => Number(v||0).toFixed(3).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
const fmtOps = v => { const n=Number(v||0); return Math.abs(n-Math.round(n))<0.05 ? String(Math.round(n)) : n.toFixed(1); };
function trendClass(t){return (t||'').toLowerCase()==='up'?'up':((t||'').toLowerCase()==='down'?'down':'lateral')}
function trendIcon(t){return (t||'').toLowerCase()==='up'?'↑':((t||'').toLowerCase()==='down'?'↓':'→')}
function ladderDisplayDate(){return DATA.metrics.ladder_for;}
function formatEasternDate(){return ladderDisplayDate();}
function nextLadderDate(){return ladderDisplayDate();}

function kpi(){
 const m=DATA.metrics;
 const mr=DATA.shadow_market_regime||{};
 const mrScore=Number(mr.score), mrHas=Number.isFinite(mrScore), mrRegime=mr.regime||'Pending', mrPct=Number(mr.shadow_capital_pct||100);
 const mrClass=mrHas?(mrScore>=55?'positive':(mrScore<40?'negative':'warning-text')):'';
 const cp=DATA.shadow_capital_preservation||{};
 const cpScore=Number(cp.score), cpHas=Number.isFinite(cpScore), cpRegime=cp.regime||'Pending', cpPct=Number(cp.shadow_capital_pct||100);
 const cpClass=cpHas?(cpScore<25?'positive':(cpScore>=65?'negative':'warning-text')):'';

 // Decision Center is now a compact attention/navigation layer only.
 // Recommendation State + ladders remain the authoritative trading instructions.
 const candidates=DATA.stocks.filter(s=>s.lifecycle_state!=='archived');
 const buy=[...candidates].filter(s=>s.buy?.length).sort((a,b)=>Number(b.final_ops??b.opportunity??0)-Number(a.final_ops??a.opportunity??0))[0] || candidates[0];
 const manage=[...candidates].filter(s=>s.has_active_position && s.sell?.length).sort((a,b)=>(b.weight||0)-(a.weight||0))[0] || candidates.find(s=>s.has_active_position) || candidates[0];
 const risk=[...candidates].filter(s=>s.has_active_position && s.trend!=='Up').sort((a,b)=>Number(a.final_ops??a.opportunity??0)-Number(b.final_ops??b.opportunity??0))[0] || candidates.find(s=>s.has_active_position) || candidates[0];
 PRIMARY_DECISION_SYMBOL=buy?.symbol || candidates[0]?.symbol || null;
 const compact=(kind,label,stock)=>stock?`<div class="kpi decision-kpi ${kind}" onclick="selectStock('${stock.symbol}')" title="Attention/navigation only. Open the stock to view the authoritative Recommendation State and ladder."><div class="label">${label}<span class="decision-score">${fmtOps(stock.final_ops??stock.opportunity??0)}</span></div><div class="decision-symbol">${stock.symbol}</div><small>${stock.position_state?.name||stock.trend||''} · View ladder →</small></div>`:'';

 document.getElementById('kpis').innerHTML=`
 <div class="kpi"><div class="label">Account Total</div><div class="value">${fmtMoney(m.account_total)}</div><small>Market value</small></div>
 <div class="kpi"><div class="label">Effective Cash</div><div class="value">${fmtMoney(m.effective_cash)}</div><small>Raw cash + pending</small></div>
 <div class="kpi"><div class="label">Buying Power</div><div class="value">${fmtMoney(m.deployable)}</div><small>After 15% reserve</small></div>
 <div class="kpi" title="Shadow observer only. This score does not affect OPS, recommendations, buy/sell ladders, or live capital allocation."><div class="label">Market Regime · Shadow</div><div class="value ${mrClass}">${mrHas?mrScore.toFixed(1):'—'}</div><small><b>${mrRegime}</b> · Hypothetical buy capital ${mrPct}%</small></div>
 <div class="kpi" title="Phase 1 recession/crisis observer only. Four pillars: market deterioration, economic deterioration, financial stress, and breadth/leadership stress. Does not affect live ladders."><div class="label">Capital Preservation · Shadow</div><div class="value ${cpClass}">${cpHas?cpScore.toFixed(1):'—'}</div><small><b>${cpRegime}</b> · Hypothetical buy capital ${cpPct}%</small></div>
 <div class="kpi"><div class="label">Strategy Return (TWR)</div><div class="value ${m.twr>=0?'positive':'negative'}">${m.twr>=0?'+':''}${fmtPct(m.twr)}</div><small>Personal ROI ${m.personal_roi>=0?'+':''}${fmtPct(m.personal_roi)} · Net gain ${m.net_gain>=0?'+':''}${fmtMoney(m.net_gain)}</small></div>
 <div class="kpi"><div class="label">Today's P/L</div><div class="value ${m.today_pl>=0?'positive':'negative'}">${m.today_pl>=0?'+':''}${fmtMoney(m.today_pl)}</div><small>${m.today_pl>=0?'+':''}${fmtPct(m.today_pl_pct)}</small></div>
 <div class="kpi roi-mission"><div class="label">100% ROI Mission Pace</div><div class="value ${m.roi_pacing.status==='Ahead'?'positive':'negative'}">${m.roi_pacing.status}</div><small>Current ${fmtPct(m.roi)} · Required ${fmtPct(m.roi_pacing.required_to_date_pct)}</small><div class="progress"><div class="bar" style="width:${Math.min(100,Math.max(0,m.roi_pacing.pace_ratio_pct))}%"></div></div></div>
 ${compact('buy','BUY',buy)}
 ${compact('manage','MANAGE',manage)}
